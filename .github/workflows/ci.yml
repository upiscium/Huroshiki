name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: true
          source-revision: 03659f4394aec2317771e29041ef266669e2ee12

      - name: Check flake
        run: nix flake check

      - name: Validate repository data
        run: nix develop --command packctl validate

      - name: Check launcher syntax
        run: nix develop --command bash -n shared/scripts/huroshiki-launcher.sh
