server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires -1;

    # Keep explicit generation-aware URLs valid without inserting "current" twice.
    location ~ ^/(?<pack>[a-z0-9][a-z0-9._-]*)/client/current/(?<asset>.+)$ {
        alias /usr/share/nginx/html/$pack/client/current/$asset;
    }

    location ~ ^/(?<pack>[a-z0-9][a-z0-9._-]*)/current/(?<asset>.+)$ {
        alias /usr/share/nginx/html/$pack/current/$asset;
    }

    # v0.2-compatible public URLs resolve through v0.3's active generation.
    location ~ ^/(?<pack>[a-z0-9][a-z0-9._-]*)/client/(?<asset>.+)$ {
        alias /usr/share/nginx/html/$pack/client/current/$asset;
    }

    location ~ ^/(?<pack>[a-z0-9][a-z0-9._-]*)/server/(?<asset>.+)$ {
        alias /usr/share/nginx/html/$pack/current/$asset;
    }

    # v0.3 server namespace: /<pack>/<asset>.
    location ~ ^/(?<pack>[a-z0-9][a-z0-9._-]*)/(?<asset>.+)$ {
        alias /usr/share/nginx/html/$pack/current/$asset;
    }
}
